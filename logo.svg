<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1e3a5f"/><stop offset="1" stop-color="#0b1b33"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3d98a"/><stop offset="0.55" stop-color="#d4af5a"/><stop offset="1" stop-color="#9a7428"/>
    </linearGradient>
    <radialGradient id="face" cx="0.5" cy="0.45" r="0.6">
      <stop offset="0" stop-color="#2c5282"/><stop offset="1" stop-color="#12284a"/>
    </radialGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- pusula halkası -->
  <circle cx="256" cy="240" r="170" fill="url(#gold)"/>
  <circle cx="256" cy="240" r="148" fill="url(#face)"/>
  <!-- ana yön çentikleri -->
  <g stroke="#f3d98a" stroke-width="9" stroke-linecap="round">
    <line x1="256" y1="104" x2="256" y2="126"/>
    <line x1="256" y1="354" x2="256" y2="376"/>
    <line x1="120" y1="240" x2="142" y2="240"/>
    <line x1="370" y1="240" x2="392" y2="240"/>
  </g>
  <g stroke="#9bb4d6" stroke-width="5" stroke-linecap="round" opacity="0.8">
    <line x1="160" y1="144" x2="172" y2="156"/><line x1="352" y1="144" x2="340" y2="156"/>
    <line x1="160" y1="336" x2="172" y2="324"/><line x1="352" y1="336" x2="340" y2="324"/>
  </g>
  <!-- iğne: hedefi gösteren altın uç + beyaz uç, 45° -->
  <g transform="rotate(40 256 240)">
    <polygon points="256,92 288,240 224,240" fill="url(#gold)"/>
    <polygon points="256,388 288,240 224,240" fill="#e8eef7"/>
    <circle cx="256" cy="240" r="17" fill="#0b1b33" stroke="#f3d98a" stroke-width="6"/>
  </g>
  <!-- LGS yazısı -->
  <text x="256" y="462" text-anchor="middle" font-family="Georgia,'Times New Roman',serif" font-weight="900" font-size="74" letter-spacing="10" fill="url(#gold)">LGS</text>
</svg>
